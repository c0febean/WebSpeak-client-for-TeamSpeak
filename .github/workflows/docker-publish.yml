name: Publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image and 1Panel package version
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          image_name="ghcr.io/${REPOSITORY_OWNER,,}/webspeak"
          version="$(jq -r .version packaging/1panel/webspeak-appspec.json)"
          package_image="$(jq -r '.services[0].image' packaging/1panel/webspeak-appspec.json)"
          if [[ "$package_image" != "$image_name:$version" ]]; then
            echo "1Panel image $package_image does not match $image_name:$version" >&2
            exit 1
          fi
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.image.outputs.version }},enable={{is_default_branch}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build 1Panel local app package
        if: github.ref == 'refs/heads/master'
        run: python3 packaging/1panel/build.py --output release-artifacts
      - name: Upload 1Panel local app package
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: webspeak-1panel-${{ steps.image.outputs.version }}
          path: release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
